name: Publish to NuGet

on:
  # Publishes on the first push to main after <PackageVersion> changes to a version that has no release tag
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push the package to nuget.org, instead of only uploading it as a build artifact'
        type: boolean
        default: false

permissions:
  contents: read

# Never publish two versions at once
concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  version:
    # Only run on the main repository, not on forks
    if: github.repository == 'SideScrollUI/SideScroll.Templates'

    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.check.outputs.tag }}
      released: ${{ steps.check.outputs.released }}
      push: ${{ steps.check.outputs.push }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    # A release tag is what marks a version as published, so an untagged version is a new one
    - name: Check version
      id: check
      run: |
        version=$(sed -n 's:.*<PackageVersion>\(.*\)</PackageVersion>.*:\1:p' SideScroll.Templates.csproj | head -1)
        if [ -z "$version" ]; then
          echo "::error::Could not read <PackageVersion> from SideScroll.Templates.csproj"
          exit 1
        fi

        # Nothing shares the SideScrollVersion defaults between the templates, so they drift apart quietly
        for config in templates/*/.template.config/template.json; do
          default=$(jq -r '.symbols.SideScrollVersion.defaultValue' "$config")
          if [ "$default" != "$version" ]; then
            echo "::error file=$config::SideScrollVersion defaults to $default, but the package is version $version"
            exit 1
          fi
        done

        # Matches the release tags this repository already uses, which are the version verbatim
        tag="v$version"

        if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
          released=true
        else
          released=false
        fi

        # Pushing to main publishes new versions only, while a manual run publishes on request
        if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
          push=${{ inputs.publish }}
        elif [ "$released" = 'true' ]; then
          push=false
        else
          push=true
        fi

        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "released=$released" >> "$GITHUB_OUTPUT"
        echo "push=$push" >> "$GITHUB_OUTPUT"

        echo "Version $version ($tag), already released: $released, publishing: $push" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: version
    # Manual runs always build, so the package can be checked before publishing it
    if: github.repository == 'SideScrollUI/SideScroll.Templates' && (github.event_name == 'workflow_dispatch' || needs.version.outputs.push == 'true')

    runs-on: ubuntu-latest

    permissions:
      contents: write # Allows pushing the release tag
      id-token: write # Allows NuGet/login to exchange a GitHub OIDC token for a temporary API key

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore SideScroll.Templates.csproj

    - name: Build
      run: dotnet build SideScroll.Templates.csproj -c Release --no-restore

    - name: Pack
      run: dotnet pack SideScroll.Templates.csproj -c Release --no-build -o Packages

    - name: Upload package
      uses: actions/upload-artifact@v7
      with:
        name: nuget-package
        path: Packages/*
        if-no-files-found: error

    # A template package builds fine even when the templates inside it don't, so
    # install the packed package and check each template still creates a project
    # that compiles. This resolves the SideScroll and Avalonia versions the
    # templates default to, so it also catches defaults pointing at a version
    # that was never published.
    - name: Install .NET WASM workload
      run: dotnet workload install wasm-tools-net8

    - name: Install packed templates
      run: dotnet new install Packages/SideScroll.Templates.*.nupkg

    - name: Verify sidescroll.app template
      run: |
        dotnet new sidescroll.app -o "${{ runner.temp }}/smoke/SmokeApp"
        dotnet build "${{ runner.temp }}/smoke/SmokeApp"

    - name: Verify sidescroll.sln template
      run: |
        dotnet new sidescroll.sln -o "${{ runner.temp }}/smoke/SmokeSln"
        dotnet build "${{ runner.temp }}/smoke/SmokeSln"

    - name: Verify sidescroll.browser template
      run: |
        dotnet new sidescroll.browser -o "${{ runner.temp }}/smoke/SmokeBrowser"
        dotnet build "${{ runner.temp }}/smoke/SmokeBrowser"

    # Temporary API keys are only valid for an hour, so request one right before pushing
    - name: NuGet login
      id: login
      if: needs.version.outputs.push == 'true'
      uses: NuGet/login@v1
      with:
        user: sidescrollui # nuget.org profile name that owns the trusted publishing policy

    - name: Push to NuGet
      if: needs.version.outputs.push == 'true'
      run: |
        dotnet nuget push "Packages/*.nupkg" \
          --source https://api.nuget.org/v3/index.json \
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
          --skip-duplicate

    # Tag only after publishing succeeds, so a failed run doesn't mark the version as released
    - name: Tag release
      if: needs.version.outputs.push == 'true' && needs.version.outputs.released == 'false'
      env:
        TAG: ${{ needs.version.outputs.tag }}
      run: |
        git tag "$TAG" "$GITHUB_SHA"
        git push origin "$TAG"
        echo "Tagged $TAG" >> "$GITHUB_STEP_SUMMARY"
